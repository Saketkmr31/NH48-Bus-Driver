<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NH 48 Bus Driver - Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#090909;
    color:white;
}

/* =========================
   GAME SCREEN
========================= */

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #3c0907 0%,
            #72150d 17%,
            #c83b1c 34%,
            #472316 47%,
            #151815 60%,
            #060807 100%
        );
}

/* =========================
   SUN
========================= */

.sun{
    position:absolute;
    width:92px;
    height:92px;
    border-radius:50%;
    left:50%;
    top:115px;
    transform:translateX(-50%);
    background:#ffd36b;
    box-shadow:
        0 0 30px #ff8c2a,
        0 0 70px #ff5a1f,
        0 0 130px rgba(255,80,20,.5);
}

/* =========================
   MOUNTAINS
========================= */

.mountain{
    position:absolute;
    bottom:45%;
    width:100%;
    height:250px;
    background:#311c17;
    clip-path:polygon(
        0 100%,
        0 55%,
        13% 90%,
        26% 28%,
        39% 82%,
        51% 10%,
        65% 88%,
        78% 25%,
        90% 85%,
        100% 50%,
        100% 100%
    );
    opacity:.85;
}

/* =========================
   TREES / SIDE DARK AREA
========================= */

.side-left,
.side-right{
    position:absolute;
    bottom:0;
    width:26%;
    height:70%;
    background:linear-gradient(
        to top,
        #050907,
        #0c160e,
        rgba(12,22,14,.4)
    );
}

.side-left{
    left:0;
    clip-path:polygon(
        0 0,
        100% 35%,
        70% 100%,
        0 100%
    );
}

.side-right{
    right:0;
    clip-path:polygon(
        0 35%,
        100% 0,
        100% 100%,
        30% 100%
    );
}

/* TREE SHAPES */

.tree{
    position:absolute;
    width:150px;
    height:250px;
    background:#061008;
    border-radius:50% 50% 20% 20%;
    opacity:.95;
}

.tree::after{
    content:"";
    position:absolute;
    width:120px;
    height:180px;
    background:#07150b;
    border-radius:50%;
    bottom:-60px;
    left:15px;
}

.t1{ left:-30px; bottom:180px; }
.t2{ left:70px; bottom:100px; }
.t3{ left:-50px; bottom:-20px; }

.t4{ right:-30px; bottom:180px; }
.t5{ right:70px; bottom:100px; }
.t6{ right:-50px; bottom:-20px; }

/* =========================
   ROAD
========================= */

#road{
    position:absolute;
    width:68%;
    height:92%;
    left:50%;
    bottom:-5%;
    transform:translateX(-50%);
    background:
        linear-gradient(
            to bottom,
            #303235,
            #202124 55%,
            #111315 100%
        );

    clip-path:polygon(
        40% 0,
        60% 0,
        100% 100%,
        0 100%
    );

    box-shadow:
        inset 0 0 80px rgba(0,0,0,.6);
}

/* ROAD EDGE */

.road-line-left,
.road-line-right{
    position:absolute;
    width:4px;
    height:95%;
    bottom:0;
    background:#ffd987;
    opacity:.75;
    box-shadow:0 0 10px #ffbd50;
}

.road-line-left{
    left:18%;
    transform:rotate(-25deg);
    transform-origin:bottom;
}

.road-line-right{
    right:18%;
    transform:rotate(25deg);
    transform-origin:bottom;
}

/* =========================
   CENTER ROAD MARKINGS
========================= */

#lane{
    position:absolute;
    width:100%;
    height:100%;
    left:0;
    top:0;
}

.road-mark{
    position:absolute;
    width:10px;
    height:40px;
    background:#f5f5f5;
    left:50%;
    transform:translateX(-50%);
    opacity:.95;
    box-shadow:0 0 4px rgba(255,255,255,.5);
}

/* =========================
   ROAD LIGHTS
========================= */

.road-light{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ffbb55;
    box-shadow:
        0 0 10px #ff9d28,
        0 0 22px #ff8a00;
}

.l1{left:32%;bottom:35%;}
.l2{right:32%;bottom:35%;}
.l3{left:28%;bottom:25%;}
.l4{right:28%;bottom:25%;}
.l5{left:20%;bottom:14%;}
.l6{right:20%;bottom:14%;}

/* =========================
   TOP HEADER
========================= */

.game-title{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    font-size:12px;
    letter-spacing:6px;
    color:#ffd07b;
    font-weight:bold;
    white-space:nowrap;
    text-shadow:0 0 10px rgba(255,190,90,.5);
}

/* =========================
   STATS
========================= */

.stats{
    position:absolute;
    top:18px;
    left:18px;
    display:flex;
    gap:10px;
    z-index:30;
}

.stat-box{
    min-width:108px;
    padding:11px 15px;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            rgba(42,43,47,.96),
            rgba(20,22,25,.94)
        );

    border:1px solid rgba(255,198,110,.3);

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.stat-box span{
    display:block;
    font-size:9px;
    letter-spacing:2px;
    color:#c9c9c9;
    margin-bottom:5px;
}

.stat-box strong{
    font-size:20px;
    color:#ffe0a1;
}

/* =========================
   HOME
========================= */

.home-btn{
    position:absolute;
    right:18px;
    top:18px;
    z-index:50;

    text-decoration:none;
    color:#ffe3ad;

    padding:11px 20px;
    border-radius:25px;

    font-size:12px;
    font-weight:bold;

    background:rgba(20,20,20,.85);
    border:1px solid rgba(255,205,120,.35);
}

/* =========================
   MUSIC
========================= */

.music-btn{
    position:absolute;
    right:18px;
    top:72px;
    z-index:50;

    border:none;
    color:#ffe3ad;

    padding:11px 20px;
    border-radius:25px;

    font-size:12px;
    font-weight:bold;
    cursor:pointer;

    background:rgba(20,20,20,.88);
    border:1px solid rgba(255,205,120,.35);
}

#spotifyBox{
    position:absolute;
    right:18px;
    top:125px;
    width:345px;
    height:352px;

    z-index:100;

    display:none;

    background:#181818;
    border-radius:16px;

    overflow:hidden;

    box-shadow:
        0 15px 50px rgba(0,0,0,.65);

    border:1px solid rgba(255,205,120,.3);
}

#spotifyBox iframe{
    width:100%;
    height:100%;
    border:none;
}

/* =========================
   PLAYER BUS
========================= */

#player{
    position:absolute;
    width:150px;
    height:250px;

    left:50%;
    bottom:45px;

    transform:translateX(-50%);
    z-index:10;

    transition:left .12s ease;
}

/* BUS BODY */

.bus-body{
    position:absolute;
    width:100%;
    height:100%;

    border-radius:22px 22px 14px 14px;

    background:
        linear-gradient(
            90deg,
            #a85a23,
            #e9bd6e 15%,
            #ffe1a0 50%,
            #d59143 85%,
            #703817
        );

    border:4px solid #3b2417;

    box-shadow:
        0 15px 35px rgba(0,0,0,.7),
        inset 0 0 18px rgba(255,255,255,.35);
}

/* TOP BUS */

.bus-top{
    position:absolute;
    top:8px;
    left:10px;
    width:calc(100% - 20px);
    height:22px;

    border-radius:10px;

    background:
        linear-gradient(
            to bottom,
            #fff1bf,
            #aa7435
        );
}

/* WINDSHIELD */

.windshield{
    position:absolute;
    top:38px;
    left:14px;

    width:calc(100% - 28px);
    height:70px;

    border-radius:7px;

    background:
        linear-gradient(
            135deg,
            #324852,
            #071116
        );

    border:3px solid #7d5226;

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.8);
}

.permit{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;

    color:#f7e7b8;

    font-size:9px;
    letter-spacing:2px;
    font-weight:bold;
}

/* BUS DESTINATION */

.destination{
    position:absolute;
    top:120px;
    left:12px;
    width:calc(100% - 24px);

    padding:9px 4px;

    text-align:center;

    color:#252525;
    background:#f4ead0;

    border-radius:5px;

    font-size:20px;
    font-weight:bold;

    border:2px solid #b58d55;
}

.destination small{
    display:block;
    font-size:10px;
    margin-top:2px;
    letter-spacing:1px;
}

/* GRILL */

.grill{
    position:absolute;
    bottom:34px;
    left:15px;
    width:calc(100% - 30px);
    height:20px;

    background:
        repeating-linear-gradient(
            to bottom,
            #222 0px,
            #222 3px,
            #555 4px,
            #555 6px
        );

    border-radius:4px;
}

/* LIGHTS */

.headlight{
    position:absolute;
    width:17px;
    height:17px;
    bottom:19px;

    border-radius:50%;

    background:#f8ca62;

    border:2px solid #4e321a;

    box-shadow:0 0 8px #ffbb3d;
}

.headlight.left{
    left:15px;
}

.headlight.right{
    right:15px;
}

.plate{
    position:absolute;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);

    background:#eee;
    color:#111;

    padding:3px 8px;

    font-size:7px;
    font-weight:bold;

    border-radius:2px;
}

/* =========================
   HEADLIGHT EFFECT
========================= */

#lightBeam{
    position:absolute;
    width:260px;
    height:480px;

    left:50%;
    bottom:120px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            to top,
            rgba(255,215,130,.22),
            rgba(255,210,100,.08),
            transparent
        );

    clip-path:polygon(
        40% 100%,
        60% 100%,
        100% 0,
        0 0
    );

    opacity:0;
    pointer-events:none;

    z-index:5;
}

/* =========================
   TRAFFIC
========================= */

.enemy{
    position:absolute;
    width:95px;
    height:155px;
    z-index:8;
}

.enemy-car{
    width:100%;
    height:100%;

    border-radius:18px 18px 12px 12px;

    background:
        linear-gradient(
            90deg,
            #561414,
            #d83232 20%,
            #e84732 50%,
            #a82020 85%,
            #471010
        );

    border:4px solid #1a1111;

    box-shadow:
        0 12px 30px rgba(0,0,0,.7);
}

.enemy-window{
    position:absolute;
    top:22px;
    left:12px;

    width:calc(100% - 24px);
    height:46px;

    background:
        linear-gradient(
            135deg,
            #47616b,
            #111a1d
        );

    border-radius:7px;
    border:2px solid #211313;
}

.enemy-lights{
    position:absolute;
    bottom:18px;
    left:13px;
    right:13px;

    display:flex;
    justify-content:space-between;
}

.enemy-lights span{
    width:13px;
    height:13px;

    border-radius:50%;

    background:#ff3737;

    box-shadow:0 0 10px red;
}

/* =========================
   CONTROLS
========================= */

.controls{
    position:absolute;

    bottom:28px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:8px;

    padding:9px;

    border-radius:18px;

    background:rgba(10,13,15,.88);

    border:1px solid rgba(255,195,95,.25);

    z-index:40;
}

.control-btn{
    min-width:78px;
    height:48px;

    border:none;
    border-radius:12px;

    cursor:pointer;

    color:#eee;

    font-weight:bold;
    font-size:11px;

    background:
        linear-gradient(
            to bottom,
            #32363a,
            #202225
        );

    border:1px solid rgba(255,210,130,.18);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);
}

.control-btn:active{
    transform:scale(.95);
}

.control-btn.horn{
    color:#ffd9a0;
}

.control-btn.lights.active{
    color:#fff4b0;
    box-shadow:
        0 0 15px rgba(255,200,80,.5);
}

/* MOBILE CONTROLS */

.mobile-controls{
    display:none;
}

/* =========================
   KEYBOARD HELP
========================= */

.keyboard-help{
    position:absolute;
    left:18px;
    bottom:20px;

    z-index:30;

    padding:10px 14px;

    border-left:2px solid #ffbf62;

    background:rgba(7,10,10,.75);

    border-radius:8px;

    font-size:10px;
    letter-spacing:1px;

    color:#e9dfcc;
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    position:absolute;
    inset:0;

    display:none;

    z-index:500;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(8px);

    align-items:center;
    justify-content:center;
}

.gameover-box{
    width:min(430px,90%);
    text-align:center;

    padding:40px 30px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #25150f,
            #101315
        );

    border:1px solid rgba(255,180,80,.4);

    box-shadow:
        0 20px 80px rgba(0,0,0,.8);
}

.gameover-box h1{
    color:#ff7d55;
    font-size:42px;
    margin-bottom:15px;
}

.gameover-box p{
    color:#ddd;
    margin:10px 0;
}

.gameover-box strong{
    color:#ffd27b;
    font-size:28px;
}

.restart-btn{
    margin-top:25px;

    padding:14px 30px;

    border:none;
    border-radius:30px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ffb63f,
            #d87818
        );

    color:#201509;

    font-weight:bold;

    font-size:14px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .game-title{
        font-size:8px;
        letter-spacing:3px;
        top:14px;
    }

    .stats{
        top:12px;
        left:10px;
    }

    .stat-box{
        min-width:80px;
        padding:8px 10px;
    }

    .stat-box strong{
        font-size:15px;
    }

    .home-btn{
        top:10px;
        right:10px;
        padding:8px 12px;
    }

    .music-btn{
        top:55px;
        right:10px;
        padding:8px 12px;
    }

    #spotifyBox{
        width:90%;
        right:5%;
        top:105px;
    }

    #road{
        width:100%;
    }

    #player{
        width:105px;
        height:180px;
        bottom:105px;
    }

    .destination{
        font-size:15px;
        top:88px;
    }

    .windshield{
        top:30px;
        height:50px;
    }

    .permit{
        top:13px;
        font-size:7px;
    }

    .controls{
        display:none;
    }

    .mobile-controls{
        display:flex;

        position:absolute;
        bottom:18px;
        left:50%;

        transform:translateX(-50%);

        gap:10px;

        z-index:50;
    }

    .mobile-btn{
        width:58px;
        height:58px;

        border-radius:50%;

        border:1px solid rgba(255,210,120,.4);

        background:#202522;

        color:#ffe0a0;

        font-size:18px;
    }

    .keyboard-help{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="sun"></div>

    <div class="mountain"></div>

    <div class="side-left"></div>
    <div class="side-right"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>

    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>


    <!-- TOP -->

    <div class="game-title">
        🚌 NH 48 • BUS DRIVER • NIGHT ROUTE
    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat-box">
            <span>SPEED</span>
            <strong id="speedText">0 KM/H</strong>
        </div>

        <div class="stat-box">
            <span>DISTANCE</span>
            <strong id="distanceText">0 M</strong>
        </div>

    </div>


    <!-- HOME -->

    <a href="index.html" class="home-btn">
        ← HOME
    </a>


    <!-- MUSIC -->

    <button class="music-btn" onclick="toggleMusic()">
        🎵 MUSIC
    </button>

    <div id="spotifyBox">
        <iframe
            src="https://open.spotify.com/embed/playlist/3iYHVXAyUepzzNPKaGn3p1?utm_source=generator"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
    </div>


    <!-- ROAD -->

    <div id="road">

        <div id="lane"></div>

        <div class="road-light l1"></div>
        <div class="road-light l2"></div>
        <div class="road-light l3"></div>
        <div class="road-light l4"></div>
        <div class="road-light l5"></div>
        <div class="road-light l6"></div>

    </div>


    <div class="road-line-left"></div>
    <div class="road-line-right"></div>


    <!-- LIGHT BEAM -->

    <div id="lightBeam"></div>


    <!-- PLAYER BUS -->

    <div id="player">

        <div class="bus-body">

            <div class="bus-top"></div>

            <div class="windshield">
                <div class="permit">
                    ALL INDIA<br>
                    PERMIT
                </div>
            </div>

            <div class="destination">
                NH 48
                <small>DELHI ↔ JAIPUR</small>
            </div>

            <div class="grill"></div>

            <div class="headlight left"></div>
            <div class="headlight right"></div>

            <div class="plate">
                RJ 14 PA 1234
            </div>

        </div>

    </div>


    <!-- DESKTOP CONTROLS -->

    <div class="controls">

        <button class="control-btn" onclick="moveLeft()">
            ← LEFT
        </button>

        <button class="control-btn" onclick="accelerate()">
            ▲ GAS
        </button>

        <button class="control-btn" onclick="brake()">
            ▼ BRAKE
        </button>

        <button class="control-btn" onclick="moveRight()">
            RIGHT →
        </button>

        <button class="control-btn horn" onclick="playHorn()">
            📢 HORN
        </button>

        <button
            id="lightButton"
            class="control-btn lights"
            onclick="toggleLights()">
            💡 LIGHTS
        </button>

    </div>


    <!-- MOBILE CONTROLS -->

    <div class="mobile-controls">

        <button class="mobile-btn" onclick="moveLeft()">←</button>
        <button class="mobile-btn" onclick="accelerate()">▲</button>
        <button class="mobile-btn" onclick="moveRight()">→</button>

    </div>


    <!-- HELP -->

    <div class="keyboard-help">
        A/← : STEER LEFT &nbsp; | &nbsp;
        D/→ : STEER RIGHT &nbsp; | &nbsp;
        W : ACCELERATE &nbsp; | &nbsp;
        S : BRAKE &nbsp; | &nbsp;
        H : HORN &nbsp; | &nbsp;
        L : LIGHTS
    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="gameover-box">

            <h1>💥 CRASH!</h1>

            <p>Your final distance</p>

            <strong id="finalDistance">0 M</strong>

            <p>Best Distance: <span id="bestDistance">0 M</span></p>

            <button class="restart-btn" onclick="restartGame()">
                🚌 DRIVE AGAIN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

const player = document.getElementById("player");

const speedText = document.getElementById("speedText");
const distanceText = document.getElementById("distanceText");

const gameOverScreen = document.getElementById("gameOver");

const finalDistance = document.getElementById("finalDistance");
const bestDistanceText = document.getElementById("bestDistance");

const lane = document.getElementById("lane");


let playerX = 50;

let speed = 0;
let distance = 0;

let gameRunning = true;

let lightsOn = false;

let enemies = [];

let lastSpawn = 0;

let bestDistance =
    Number(localStorage.getItem("nh48BestDistance")) || 0;


/* =========================================
   CREATE ROAD MARKINGS
========================================= */

function createRoadMarks(){

    for(let i = 0; i < 12; i++){

        const mark = document.createElement("div");

        mark.className = "road-mark";

        mark.style.top = (i * 95) + "px";

        mark.dataset.baseTop = i * 95;

        lane.appendChild(mark);

    }

}

createRoadMarks();


/* =========================================
   PLAYER MOVEMENT
========================================= */

function updatePlayer(){

    if(playerX < 30) playerX = 30;
    if(playerX > 70) playerX = 70;

    player.style.left = playerX + "%";

}


function moveLeft(){

    if(!gameRunning) return;

    playerX -= 4;

    updatePlayer();

}


function moveRight(){

    if(!gameRunning) return;

    playerX += 4;

    updatePlayer();

}


function accelerate(){

    if(!gameRunning) return;

    speed += 10;

    if(speed > 120){
        speed = 120;
    }

}


function brake(){

    if(!gameRunning) return;

    speed -= 12;

    if(speed < 0){
        speed = 0;
    }

}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener("keydown", function(event){

    if(event.key === "ArrowLeft" || event.key.toLowerCase() === "a"){
        moveLeft();
    }

    if(event.key === "ArrowRight" || event.key.toLowerCase() === "d"){
        moveRight();
    }

    if(event.key.toLowerCase() === "w"){
        accelerate();
    }

    if(event.key.toLowerCase() === "s"){
        brake();
    }

    if(event.key.toLowerCase() === "h"){
        playHorn();
    }

    if(event.key.toLowerCase() === "l"){
        toggleLights();
    }

});


/* =========================================
   LIGHTS
========================================= */

function toggleLights(){

    lightsOn = !lightsOn;

    const beam = document.getElementById("lightBeam");

    const button = document.getElementById("lightButton");


    if(lightsOn){

        beam.style.opacity = "1";

        button.classList.add("active");

    }
    else{

        beam.style.opacity = "0";

        button.classList.remove("active");

    }

}


/* =========================================
   HORNS
========================================= */

/*
IMPORTANT:

Agar kisi horn file ka extension .mp3 nahi hai,
to neeche uska exact extension likhna.

Example:
assets/Naagin Bus Horn.mp3
*/


const horns = [

    "assets/Naagin Bus Horn.mp3",
    "assets/indian-bus-horn.mp3",
    "assets/bus_horn_007.mp3",
    "assets/Bus Air Horn.mp3",
    "assets/Bus Horn.mp3"

];


function playHorn(){

    if(!gameRunning) return;


    const randomHorn =
        horns[Math.floor(Math.random() * horns.length)];


    const hornSound = new Audio(randomHorn);

    hornSound.volume = 0.7;

    hornSound.play().catch(function(error){

        console.log(
            "Horn file play nahi hua. File ka exact name/extension check karo.",
            error
        );

    });

}


/* =========================================
   MUSIC
========================================= */

function toggleMusic(){

    const spotifyBox =
        document.getElementById("spotifyBox");


    if(
        spotifyBox.style.display === "block"
    ){

        spotifyBox.style.display = "none";

    }
    else{

        spotifyBox.style.display = "block";

    }

}


/* =========================================
   ENEMY TRAFFIC
========================================= */

function createEnemy(){

    if(!gameRunning) return;


    const enemy = document.createElement("div");

    enemy.className = "enemy";


    /*
    ROAD KE ANDAR RANDOM POSITION
    */

    const randomLane =
        32 + Math.random() * 36;


    enemy.style.left =
        randomLane + "%";


    enemy.style.top = "-180px";


    enemy.innerHTML = `

        <div class="enemy-car">

            <div class="enemy-window"></div>

            <div class="enemy-lights">

                <span></span>
                <span></span>

            </div>

        </div>

    `;


    document
        .getElementById("game")
        .appendChild(enemy);


    enemies.push({

        element:enemy,

        x:randomLane,

        y:-180,

        speed:
            2.5 + Math.random() * 2

    });

}


/* =========================================
   COLLISION
========================================= */

function checkCollision(enemy){

    const playerRect =
        player.getBoundingClientRect();

    const enemyRect =
        enemy.element.getBoundingClientRect();


    const padding = 15;


    return (

        playerRect.left + padding <
        enemyRect.right - padding

        &&

        playerRect.right - padding >
        enemyRect.left + padding

        &&

        playerRect.top + padding <
        enemyRect.bottom - padding

        &&

        playerRect.bottom - padding >
        enemyRect.top + padding

    );

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    gameRunning = false;

    speed = 0;


    finalDistance.innerText =
        Math.floor(distance) + " M";


    if(distance > bestDistance){

        bestDistance =
            Math.floor(distance);

        localStorage.setItem(
            "nh48BestDistance",
            bestDistance
        );

    }


    bestDistanceText.innerText =
        bestDistance + " M";


    gameOverScreen.style.display =
        "flex";

}


/* =========================================
   RESTART
========================================= */

function restartGame(){

    location.reload();

}


/* =========================================
   MAIN GAME LOOP
========================================= */

function gameLoop(timestamp){

    if(gameRunning){

        /*
        SPEED NATURALLY SLOWLY REDUCES
        */

        if(speed > 0){

            speed -= 0.05;

            if(speed < 0){
                speed = 0;
            }

        }


        /*
        DISTANCE
        */

        distance += speed * 0.035;


        /*
        DISPLAY
        */

        speedText.innerText =
            Math.floor(speed) + " KM/H";


        distanceText.innerText =
            Math.floor(distance) + " M";


        /*
        ROAD MARKINGS MOVE
        */

        const marks =
            document.querySelectorAll(".road-mark");


        marks.forEach(function(mark){

            let top =
                parseFloat(mark.style.top);


            top +=
                1.5 + speed * 0.12;


            if(top > window.innerHeight){

                top = -60;

            }


            mark.style.top =
                top + "px";

        });


        /*
        TRAFFIC SPAWN
        */

        const spawnGap =
            Math.max(
                900,
                2300 - speed * 8
            );


        if(timestamp - lastSpawn > spawnGap){

            createEnemy();

            lastSpawn = timestamp;

        }


        /*
        MOVE ENEMIES
        */

        enemies.forEach(function(enemy, index){

            enemy.y +=
                enemy.speed +
                speed * 0.06;


            enemy.element.style.top =
                enemy.y + "px";


            /*
            COLLISION
            */

            if(checkCollision(enemy)){

                gameOver();

            }


            /*
            REMOVE WHEN OUTSIDE SCREEN
            */

            if(
                enemy.y >
                window.innerHeight + 200
            ){

                enemy.element.remove();

                enemies.splice(index, 1);

            }

        });


        /*
        AUTO DIFFICULTY
        */

        if(
            distance > 300 &&
            speed < 25
        ){

            speed += 0.02;

        }

    }


    requestAnimationFrame(gameLoop);

}


/* =========================================
   START
========================================= */

bestDistanceText.innerText =
    bestDistance + " M";


requestAnimationFrame(gameLoop);

</script>
